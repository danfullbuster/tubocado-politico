<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Admin Tu Bocado Político</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F5C31A;min-height:100vh;display:flex;align-items:center;justify-content:center;}
.card{background:#0C0D0F;border:4px solid #0C0D0F;width:100%;max-width:420px;padding:0;}
.card-top{background:#F5C31A;padding:32px 36px 28px;border-bottom:4px solid #0C0D0F;}
.brand{font-family:'Bebas Neue',sans-serif;font-size:28px;color:#0C0D0F;letter-spacing:0.03em;}
.brand span{color:rgba(12,13,15,0.35);}
.brand-sub{font-size:12px;text-transform:uppercase;letter-spacing:0.12em;color:rgba(12,13,15,0.55);margin-top:2px;}
.card-body{padding:32px 36px;}
.card-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:#fff;letter-spacing:0.02em;margin-bottom:4px;}
.card-hint{font-size:13px;color:rgba(255,255,255,0.45);margin-bottom:28px;}
.form-group{margin-bottom:18px;}
.form-label{display:block;font-family:'Bebas Neue',sans-serif;font-size:12px;letter-spacing:0.12em;color:rgba(255,255,255,0.5);margin-bottom:6px;}
.form-input{width:100%;padding:13px 14px;background:rgba(255,255,255,0.07);border:2px solid rgba(255,255,255,0.12);color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border-color .15s;}
.form-input::placeholder{color:rgba(255,255,255,0.25);}
.form-input:focus{border-color:#F5C31A;}
.btn-login{width:100%;margin-top:8px;background:#F5C31A;color:#0C0D0F;border:none;padding:16px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:0.12em;cursor:pointer;transition:background .15s;}
.btn-login:hover{background:#e6b500;}
.btn-login:disabled{background:rgba(245,195,26,0.3);cursor:not-allowed;}
.error-msg{background:rgba(192,57,43,0.15);border:2px solid #c0392b;color:#e74c3c;font-size:13px;padding:12px 14px;margin-top:14px;display:none;}
.error-msg.show{display:block;}
.card-footer{padding:20px 36px;border-top:2px solid rgba(255,255,255,0.08);text-align:center;font-size:12px;color:rgba(255,255,255,0.3);}
</style>
</head>
<body>

<div class="card">
  <div class="card-top">
    <div class="brand">TU<span>/</span>BOCADO POLÍTICO</div>
    <div class="brand-sub">Panel de administración</div>
  </div>
  <div class="card-body">
    <div class="card-title">¡Hola!</div>
    <div class="card-hint">Ingresa con tu cuenta para publicar noticias.</div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Tu correo electrónico</label>
        <input class="form-input" type="email" id="email" placeholder="tuemail@correo.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button class="btn-login" type="submit" id="btnLogin">ENTRAR →</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>
  <div class="card-footer">Porque la política sí se puede masticar 🇨🇴</div>
</div>

<script>
// Si ya está logueado, redirigir al dashboard
fetch('/api/me').then(r => { if (r.ok) location.href = '/admin/dashboard.html'; });

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('errorMsg');
  btn.disabled = true;
  btn.textContent = 'Entrando...';
  err.classList.remove('show');

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      email:    document.getElementById('email').value,
      password: document.getElementById('password').value
    })
  });

  if (res.ok) {
    location.href = '/admin/dashboard.html';
  } else {
    const data = await res.json();
    err.textContent = data.error || 'Error al iniciar sesión';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'ENTRAR →';
  }
});
</script>
</body>
</html>
